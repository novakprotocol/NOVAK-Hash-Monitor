schema_version: n.repo.standard.v1
profile: tier3-static-site-extension
owner_repository: novakprotocol/NOVAK-Hash-Monitor
surface_path: password-threat-lab
route_decision: extend-existing
language_policy:
  java: prohibited
  browser_javascript: allowed
  python_tooling: standard-library-only
runtime_boundary:
  local_first: true
  third_party_runtime_dependencies: prohibited
  network_submission: prohibited
  persistent_storage: prohibited
claim_boundary:
  status: candidate
  production_ready: false
  production_grade: false
  formal_security_audit: false
  hosted_ci_green: false
  quantum_wall_clock_estimate: false
required_checks:
  - python scripts/check_napp_contract.py
  - python scripts/check_surface_contract.py
  - python scripts/check_static_site.py
  - python -m unittest discover -s tests -p test_*.py -v
  - python scripts/quality_gate.py
protected_changes:
  - repository settings
  - GitHub workflows
  - secrets and credentials
  - license and contribution terms
  - releases and packages
  - repository visibility
  - root Pages behavior
